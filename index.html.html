<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saleh AI - Smart Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; height: 100vh; width: 100vw; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .chat-container { scroll-behavior: smooth; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .toast-enter { animation: fadeIn 0.3s ease-out forwards; }
        pre.code-block { background:#0b1220; border:1px solid #334155; border-radius:12px; padding:12px; overflow-x:auto; font-size:12.5px; line-height:1.55; white-space:pre-wrap; }
    </style>
</head>
<body class="flex items-center justify-center relative">

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <div id="auth-screen" class="w-full max-w-md p-8 glass-panel rounded-3xl shadow-2xl z-40 mx-4 max-h-[90vh] overflow-y-auto">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-indigo-500/30">
                <i data-lucide="brain-circuit" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Saleh AI</h1>
            <p class="text-slate-400" id="auth-subtitle" data-i18n="loginSubtitle">Log in to your account</p>
        </div>

        <div class="space-y-4">
            <div id="register-fields" class="hidden space-y-4">
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-slate-300 mb-1" data-i18n="firstName">First Name</label>
                        <input type="text" id="auth-fname" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500" placeholder="John">
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-slate-300 mb-1" data-i18n="lastName">Last Name</label>
                        <input type="text" id="auth-lname" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500" placeholder="Doe">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" data-i18n="dob">Date of Birth</label>
                    <input type="date" id="auth-dob" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500" style="color-scheme: dark;">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1" data-i18n="callMeBy">Call me by:</label>
                    <select id="auth-preference" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500 cursor-pointer" onchange="toggleNicknameField()">
                        <option value="first" data-i18n="prefFirst">First Name only</option>
                        <option value="last" data-i18n="prefLast">Last Name only</option>
                        <option value="full" data-i18n="prefFull">Full Name</option>
                        <option value="nickname" data-i18n="prefNick">My Nickname</option>
                    </select>
                </div>
                <div id="nickname-field" class="hidden">
                    <label class="block text-sm font-medium text-slate-300 mb-1" data-i18n="nickname">Nickname</label>
                    <input type="text" id="auth-nickname" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500" placeholder="Hero, Boss...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-emerald-400 mb-1" data-i18n="aiPersonality">AI Personality</label>
                    <select id="auth-personality" class="w-full bg-slate-800/50 border border-emerald-600/50 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-emerald-500 cursor-pointer">
                        <option value="concise" data-i18n="modeConcise">Professional and concise</option>
                        <option value="friendly" data-i18n="modeFriendly">Friendly and direct</option>
                        <option value="emotional" data-i18n="modeEmotional">Emotional friend (warm, short)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1" data-i18n="email">Email</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                    <input type="email" id="auth-email" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-indigo-500" placeholder="name@example.com">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1" data-i18n="password">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                    <input type="password" id="auth-password" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl py-3 pl-10 pr-4 text-white focus:outline-none focus:border-indigo-500" placeholder="********">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1" data-i18n="appLanguage">App language</label>
                <select id="ui-lang-selector" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500 cursor-pointer" onchange="setUiLang(this.value)"></select>
            </div>

            <button onclick="handleAuth()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-500/30 mt-4" id="auth-btn" data-i18n="logIn">Log In</button>

            <div class="flex items-center justify-between mt-4 text-sm">
                <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-indigo-400 hover:text-indigo-300" data-i18n="createAccount">Create Account</button>
                <button onclick="showSupport()" class="text-slate-400 hover:text-white flex items-center gap-1"><i data-lucide="help-circle" class="w-4 h-4"></i> <span data-i18n="support">Support</span></button>
            </div>
            <div class="flex items-center justify-between mt-2 text-sm">
                <button onclick="forgotPassword()" class="text-amber-400 hover:text-amber-300" data-i18n="forgotPassword">Forgot password?</button>
                <button onclick="continueAsGuest()" class="text-emerald-400 hover:text-emerald-300 flex items-center gap-1"><i data-lucide="user-round" class="w-4 h-4"></i> <span data-i18n="guestMode">Continue as guest</span></button>
            </div>

            <div id="reset-panel" class="hidden space-y-4 mt-6 pt-6 border-t border-slate-700">
                <p class="text-sm text-slate-300" data-i18n="newPasswordHint">Enter your new password:</p>
                <input type="password" id="reset-password" class="w-full bg-slate-800/50 border border-slate-600 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-indigo-500" placeholder="********">
                <button onclick="applyNewPassword()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl" data-i18n="resetPassword">Reset password</button>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden w-full h-full flex flex-col md:flex-row relative">

        <div class="w-full md:w-72 glass-panel border-r border-slate-700/50 flex flex-col h-full absolute md:relative z-40 transform transition-all duration-300 -translate-x-full md:translate-x-0" id="sidebar">
            <div class="p-4 border-b border-slate-700/50 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><i data-lucide="brain" class="w-4 h-4 text-white"></i></div>
                    <span class="font-bold text-lg">Saleh AI</span>
                </div>
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white p-1 bg-slate-800 rounded"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <div class="p-3">
                <button onclick="createNewChat()" class="w-full bg-slate-700/50 hover:bg-indigo-600 border border-slate-600 hover:border-indigo-500 rounded-xl py-2.5 px-4 flex items-center justify-center gap-2 font-medium">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span data-i18n="newChat">New Chat</span>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-2" id="chat-history-list"></div>

            <div class="p-3 border-t border-slate-700/50">
                <button onclick="toggleConnections()" class="w-full flex items-center justify-between text-xs text-slate-300 hover:text-white px-1 py-1.5">
                    <span class="flex items-center gap-2"><i data-lucide="link-2" class="w-4 h-4"></i> <span data-i18n="connections">Connections</span></span>
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </button>
                <div id="connections-list" class="hidden grid grid-cols-2 gap-2 mt-2"></div>
            </div>

            <div class="p-4 border-t border-slate-700/50 text-xs text-slate-400 flex items-center justify-between gap-2">
                <span class="truncate max-w-[120px]" id="current-user-email"></span>
                <div class="flex gap-1">
                    <button onclick="openSettings()" class="text-slate-400 hover:text-indigo-400 p-1" title="Settings"><i data-lucide="settings" class="w-4 h-4"></i></button>
                    <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-1" title="Log out"><i data-lucide="log-out" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col h-full relative bg-[#0f172a]">
            <div class="h-16 glass-panel border-b border-slate-700/50 flex items-center justify-between px-3 md:px-6 z-10 shrink-0 gap-2">
                <div class="flex items-center gap-2 min-w-0">
                    <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white bg-slate-800 p-1.5 rounded-lg border border-slate-700"><i data-lucide="menu" class="w-5 h-5"></i></button>
                    <div class="relative">
                    <button id="model-btn" onclick="toggleModelMenu(event)" class="flex items-center gap-2 bg-slate-800 border border-slate-600 hover:border-indigo-500 text-slate-100 text-xs md:text-sm rounded-xl px-3 py-1.5"><i data-lucide="sparkles" class="w-4 h-4 text-indigo-400"></i><span id="model-btn-label">Saleh AI Pro</span><i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i></button>
                    <div id="model-menu" class="hidden absolute left-0 top-11 z-50 w-72 max-h-[70vh] overflow-y-auto bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-2"></div>
                    </div>
                    <select id="engine-selector" class="hidden bg-slate-800 border border-slate-600 text-slate-200 text-xs md:text-sm rounded-lg p-1.5 cursor-pointer outline-none" onchange="saveEngine(this.value)">
                        <optgroup label="Saleh AI">
                            <option value="saleh-fast">Saleh AI Fast</option>
                            <option value="saleh-think">Saleh AI Thinking</option>
                            <option value="saleh-pro">Saleh AI Pro</option>
                            <option value="saleh-ultra">Saleh AI Ultra Pro Max</option>
                        </optgroup>
                        <optgroup label="Models">
                            <option value="gemini-flash-lite">Gemini Flash Lite</option>
                            <option value="gemini-flash">Gemini Flash</option>
                            <option value="gemini-pro">Gemini Pro</option>
                            <option value="chatgpt-lite">ChatGPT Sadə</option>
                        </optgroup>
                    </select>
                </div>
                <div class="flex items-center gap-1 md:gap-2">
                    <button onclick="openCommunity()" class="text-slate-400 hover:text-indigo-400 p-2 rounded-lg hover:bg-slate-800" title="Community"><i data-lucide="globe" class="w-5 h-5"></i></button>
                    <button onclick="openCanvas()" class="text-slate-400 hover:text-indigo-400 p-2 rounded-lg hover:bg-slate-800" title="Canvas"><i data-lucide="pen-tool" class="w-5 h-5"></i></button>
                    <button onclick="toggleCameraPanel()" class="text-slate-400 hover:text-indigo-400 p-2 rounded-lg hover:bg-slate-800" title="Camera"><i data-lucide="camera" class="w-5 h-5"></i></button>
                </div>
            </div>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 chat-container flex flex-col gap-4"></div>

            <div class="w-full p-4 glass-panel border-t border-slate-700/50 z-20 shrink-0">
                <div class="max-w-4xl mx-auto flex flex-col gap-2">
                    <div id="image-attachment-preview" class="hidden relative self-start mb-1">
                        <img id="attached-img-tag" src="" class="w-20 h-20 md:w-24 md:h-24 object-cover rounded-xl border border-slate-600 shadow-md">
                        <button onclick="removeAttachedImage()" class="absolute -top-2 -right-2 bg-red-500 text-white p-1 rounded-full hover:bg-red-600 shadow-md"><i data-lucide="x" class="w-3 h-3"></i></button>
                    </div>

                    <div class="relative flex items-center gap-2 bg-slate-800/80 border border-slate-600 rounded-2xl px-3 py-2 shadow-lg focus-within:border-indigo-500">
                        <div class="relative">
                            <button onclick="togglePlusMenu()" id="plus-btn" class="text-slate-300 hover:text-indigo-400 p-2 rounded-xl hover:bg-slate-700/60" title="Tools">
                                <i data-lucide="plus" class="w-5 h-5"></i>
                            </button>
                            <div id="plus-menu" class="hidden absolute bottom-14 left-0 w-64 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-2 z-50"></div>
                        </div>
                        <input type="file" id="gallery-input" accept="image/*" class="hidden" onchange="handleGalleryUpload(event)">

                        <textarea id="chat-input" rows="1" class="flex-1 bg-transparent border-none text-white focus:outline-none px-1 py-2 resize-none max-h-32 overflow-y-auto leading-relaxed" style="min-height: 44px;" placeholder="Type a message..." oninput="this.style.height='44px'; this.style.height=(this.scrollHeight)+'px';" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendChatMessage();}"></textarea>

                        <button onclick="toggleVoiceInput()" id="mic-btn" class="text-slate-400 hover:text-red-400 p-2"><i data-lucide="mic" id="mic-icon" class="w-5 h-5"></i></button>
                        <button onclick="sendChatMessage()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-xl shadow-md"><i data-lucide="send" class="w-5 h-5"></i></button>
                    </div>

                    <div id="mode-chip-row" class="hidden items-center gap-2 px-1">
                        <span class="text-[11px] text-slate-400" data-i18n="selectedTool">Selected tool:</span>
                        <span class="inline-flex items-center gap-2 bg-indigo-600/20 border border-indigo-500/40 text-indigo-200 text-xs px-3 py-1.5 rounded-full">
                            <i data-lucide="wand-2" class="w-3.5 h-3.5"></i>
                            <span id="mode-chip-label"></span>
                            <button onclick="clearMode()" class="hover:text-white"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div id="media-preview-sidebar" class="w-full md:w-80 glass-panel border-l border-slate-700/50 flex flex-col hidden h-full absolute md:relative right-0 top-0 z-30">
            <div class="h-16 border-b border-slate-700/50 flex items-center justify-between px-4 shrink-0 bg-slate-900/50">
                <span class="font-semibold flex items-center gap-2 text-indigo-400"><i data-lucide="scan-eye" class="w-5 h-5"></i> AI Vision</span>
                <button onclick="toggleCameraPanel(false)" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="bg-slate-800/80 rounded-xl p-3 border border-slate-700">
                    <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-slate-600 mb-3">
                        <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
                    </div>
                    <button onclick="captureAndSolve()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-sm py-2 rounded-lg font-medium text-white flex items-center justify-center gap-2">
                        <i data-lucide="aperture" class="w-4 h-4"></i> <span data-i18n="captureAnalyze">Capture and analyze</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-modal" class="hidden fixed inset-0 z-[90] bg-black/70 backdrop-blur-sm p-2 md:p-6">
        <div class="w-full h-full glass-panel rounded-2xl flex flex-col overflow-hidden">
            <div class="h-14 border-b border-slate-700/50 flex items-center justify-between px-4 shrink-0 gap-2">
                <span class="font-semibold flex items-center gap-2 text-indigo-300"><i data-lucide="pen-tool" class="w-5 h-5"></i> <span data-i18n="canvas">Canvas</span></span>
                <div class="flex items-center gap-2">
                    <button onclick="switchCanvasTab('draw')" id="tab-draw" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:border-indigo-500" data-i18n="drawBoard">Draw board</button>
                    <button onclick="switchCanvasTab('live')" id="tab-live" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:border-indigo-500" data-i18n="liveApp">Live app</button>
                    <button onclick="switchCanvasTab('code')" id="tab-code" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:border-indigo-500">Kod</button>
                    <button onclick="closeCanvas()" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
            </div>
            <div class="flex-1 relative overflow-hidden">
                <div id="canvas-draw-pane" class="absolute inset-0 flex flex-col">
                    <div class="flex items-center gap-2 p-2 border-b border-slate-700/50 flex-wrap">
                        <input type="color" id="brush-color" value="#818cf8" class="w-9 h-9 bg-transparent border border-slate-600 rounded-lg cursor-pointer">
                        <input type="range" id="brush-size" min="1" max="40" value="6" class="w-28">
                        <button onclick="clearDrawing()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:border-red-500" data-i18n="clear">Clear</button>
                        <button onclick="sendDrawingToAI()" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700" data-i18n="askAiDrawing">Ask AI about drawing</button>
                    </div>
                    <canvas id="draw-canvas" class="flex-1 bg-[#0b1220] touch-none"></canvas>
                </div>
                <div id="canvas-live-pane" class="absolute inset-0 hidden bg-white">
                    <iframe id="canvas-frame" class="w-full h-full border-0" sandbox="allow-scripts allow-pointer-lock allow-modals"></iframe>
                </div>
                <div id="canvas-code-pane" class="absolute inset-0 hidden flex flex-col bg-[#0b1220]">
                    <div class="flex items-center gap-2 p-2 border-b border-slate-700/50">
                        <button onclick="copyCanvasCode()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:border-indigo-500">Kopyala</button>
                        <button onclick="runCanvasCode()" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700">İşə sal</button>
                    </div>
                    <textarea id="canvas-code" spellcheck="false" class="flex-1 w-full bg-transparent text-emerald-200 font-mono text-xs p-3 outline-none resize-none"></textarea>
                </div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 z-[95] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-md glass-panel rounded-2xl p-6 space-y-5 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-lg" data-i18n="settings">Settings</h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1" data-i18n="conversationMode">Conversation mode</label>
                <select id="settings-personality" class="w-full bg-slate-800/60 border border-slate-600 rounded-xl py-2.5 px-3 text-white cursor-pointer">
                    <option value="concise" data-i18n="modeConcise">Professional and concise</option>
                    <option value="friendly" data-i18n="modeFriendly">Friendly and direct</option>
                    <option value="emotional" data-i18n="modeEmotional">Emotional friend (warm, short)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1" data-i18n="appLanguage">App language</label>
                <select id="settings-ui-lang" class="w-full bg-slate-800/60 border border-slate-600 rounded-xl py-2.5 px-3 text-white cursor-pointer" onchange="setUiLang(this.value)"></select>
            </div>
            <div>
                <label class="block text-sm text-slate-300 mb-1" data-i18n="speakLanguage">Language the AI speaks</label>
                <select id="settings-speak-lang" class="w-full bg-slate-800/60 border border-slate-600 rounded-xl py-2.5 px-3 text-white cursor-pointer" onchange="setSpeakLang(this.value)"></select>
                <p class="text-[11px] text-slate-400 mt-1" data-i18n="speakLanguageHint">Closed (Auto): the AI answers in the language you write in. Pick a language to lock it.</p>
            </div>
            <button onclick="savePersonality()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-2.5 rounded-xl font-medium" data-i18n="save">Save</button>
            <div class="border-t border-slate-700/60 pt-4 space-y-2">
                <button onclick="deleteAllChats()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 py-2.5 rounded-xl text-sm" data-i18n="deleteAllChats">Delete all chats</button>
                <button onclick="deleteAccount()" class="w-full bg-red-600/90 hover:bg-red-600 py-2.5 rounded-xl text-sm font-semibold" data-i18n="deleteAccount">Delete account</button>
            </div>

    /* Detect the language of a piece of text so "Auto" mode can mirror it. */
    function detectLang(text) {
        const s = String(text || '');
        if (/[\u0600-\u06FF]/.test(s)) return 'ar-SA';
        if (/[\u0400-\u04FF]/.test(s)) return 'ru-RU';
        if (/[\u3040-\u30FF]/.test(s)) return 'ja-JP';
        if (/[\uAC00-\uD7AF]/.test(s)) return 'ko-KR';
        if (/[\u4E00-\u9FFF]/.test(s)) return 'zh-CN';
        const low = ' ' + s.toLowerCase() + ' ';
        if (/[əğışöüçĞİŞÖÜÇƏ]/.test(s) && /(və|mən|sən|üçün|olar|nədir|salam|necə|edir|deyil)/i.test(s)) return 'az-AZ';
        if (/[ğışöüçİ]/.test(s) && /(ve|ben|sen|için|nedir|merhaba|nasıl|değil|bir)/i.test(s)) return 'tr-TR';
        if (/(¿|¡)/.test(s) || / (hola|gracias|porque|cómo|qué|puedes|quiero) /i.test(low)) return 'es-ES';
        if (/ (bonjour|merci|pourquoi|comment|je suis|s'il) /i.test(low)) return 'fr-FR';
        if (/ (hallo|danke|warum|wie geht|ich bin|nicht) /i.test(low)) return 'de-DE';
        if (/ (olá|obrigado|porque|você|como está) /i.test(low)) return 'pt-BR';
        if (/ (ciao|grazie|perché|come stai) /i.test(low)) return 'it-IT';
        return 'en-US';
    }

        try { if (window.top && window.top.location.origin) base = window.top.location.origin; } catch (e) {}
        return `${base}/play/${id}`;
    }

    window.copyShareLink = function(id) {
        const url = shareLink(id);
        const done = () => showToast(url, "success");
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done).catch(done);
        } else {
            const ta = document.createElement('textarea');
            ta.value = url; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            ta.remove(); done();
        }
    };

    window.publishItem = async function(chatId, idx) {
        const msg = chats[chatId] && chats[chatId].messages[idx];
        if (!msg) return;
        const id = 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const item = {
            id,
            author: ((currentUserData && currentUserData.prefName) || 'User').slice(0, 80),
            kind: msg.music ? 'music' : (msg.video ? 'video' : 'app'),
            title: String(msg.text).replace(/<[^>]*>/g, ' ').trim().slice(0, 60) || 'Untitled',
            music: msg.music || null,
            html: msg.html || null,
            video: msg.video || null
        };
        try {
            const r = await fetch('/api/public/community', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item)
            });
            if (!r.ok) throw new Error('publish');
        } catch (e) { showToast('Publish failed, try again', "error"); return; }
        localStorage.setItem('saleh_my_items', JSON.stringify([id, ...myItems()].slice(0, 200)));
        showToast(t('published'), "success");
        copyShareLink(id);
        openCommunity();
    };

    window.voteCommunity = async function(id, dir) {
        const p = communityCache.find(x => x.id === id);
        if (!p) return;
        const votes = myVotes();
        const prev = votes[id] || 0;
        if (prev === dir) return showToast(t('alreadyVoted'), "info");
        if (prev === 1) p.likes = Math.max(0, (p.likes || 0) - 1);
        if (prev === -1) p.dislikes = Math.max(0, (p.dislikes || 0) - 1);
        if (dir === 1) p.likes = (p.likes || 0) + 1; else p.dislikes = (p.dislikes || 0) + 1;
        votes[id] = dir;
        localStorage.setItem('saleh_votes', JSON.stringify(votes));
        renderCommunity();
        fetch('/api/public/community', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'vote', id, dir, prev })
        }).catch(() => {});
    };

    function playItem(p) {
        if (p.kind === 'music' && p.music) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playSong(audioCtx, p.music);
            showToast(t('playMusic'), "success");

            closeCommunity();
            openCanvasWithHtml(p.html);
        } else if (p.video) {
            closeCommunity();
            openCanvasWithHtml(`<body style="margin:0;background:#000;display:grid;place-items:center;height:100vh"><video src="${p.video}" controls autoplay playsinline style="max-width:100%;max-height:100%"></video></body>`);
        }
    }

    function cacheProfile(email, profile) {
        const usersDB = JSON.parse(localStorage.getItem('saleh_ai_users_db')) || {};

    function loadProfile(email, meta) {
        const usersDB = JSON.parse(localStorage.getItem('saleh_ai_users_db')) || {};
        const cached = usersDB[email];
        const profile = (cached && typeof cached === 'object') ? cached : {};
        ['fname','lname','dob','prefName','personality'].forEach(k => { if (meta && meta[k]) profile[k] = meta[k]; });
        if (!profile.prefName) profile.prefName = email.split('@')[0];
        if (!profile.personality) profile.personality = 'concise';
        cacheProfile(email, profile);
        return profile;
    }

    async function handleAuth() {
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        if (!email || !password) return showToast(t('enterEmailFirst'), "error");
        if (!sb) return showToast(t('connectionError'), "error");
        const btn = document.getElementById('auth-btn');
        btn.disabled = true;
        try {
            if (!isLoginMode) {
                const fname = document.getElementById('auth-fname').value.trim();
                const lname = document.getElementById('auth-lname').value.trim();
                const dob = document.getElementById('auth-dob').value;
                const pref = document.getElementById('auth-preference').value;
                const nickname = document.getElementById('auth-nickname').value.trim();
                const personality = document.getElementById('auth-personality').value;
                if (!fname || !lname || !dob) return showToast("Name, surname and date of birth required", "error");
                if (pref === 'nickname' && !nickname) return showToast("Nickname required", "error");
                let prefName = fname;
                if (pref === 'last') prefName = lname;
                else if (pref === 'full') prefName = fname + ' ' + lname;
                else if (pref === 'nickname') prefName = nickname;
                const profile = { fname, lname, dob, prefName, personality };
                const { data, error } = await sb.auth.signUp({
                    email, password,
                    options: { data: profile, emailRedirectTo: window.location.origin + '/saleh-ai.html' }
                });
                if (error) {
                    if (/already|registered|exists/i.test(error.message)) showToast(t('emailExists'), "error");
                    else showToast(error.message, "error");
                    return;
                }
                cacheProfile(email, profile);
                if (data.session) {
                    showToast(t('saved'), "success");
                    processLogin(email, profile);
                } else {
                    showToast(t('checkEmailConfirm'), "success");
                }
            } else {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) {
                    if (/invalid login/i.test(error.message)) showToast(t('wrongCredentials'), "error");
                    else if (/confirm/i.test(error.message)) showToast(t('checkEmailConfirm'), "error");
                    else showToast(error.message, "error");
                    return;
                }
                const meta = (data.user && data.user.user_metadata) || {};
                processLogin(email, loadProfile(email, meta));
            }
        } catch (e) {
            console.error(e);
            showToast(t('connectionError'), "error");
        } finally {
            btn.disabled = false;
        }
    }

    /* Ultra Pro Max: 3 runs per day. The remaining count is never shown. */
    function ultraDayKey() {
        const d = new Date();
        return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }
    function ultraUsesLeft() {
        const raw = JSON.parse(localStorage.getItem('saleh_ultra_usage') || '{}');
        return 3 - (raw[ultraDayKey()] || 0);
    }
    function consumeUltra() {
        const raw = JSON.parse(localStorage.getItem('saleh_ultra_usage') || '{}');
        raw[ultraDayKey()] = (raw[ultraDayKey()] || 0) + 1;
        localStorage.setItem('saleh_ultra_usage', JSON.stringify(raw));
    }

    /* The engine actually sent to the backend for this request. */
    function activeEngine() {
        if (engine === 'saleh-ultra') {
            if (ultraUsesLeft() <= 0) {
                showToast(t('ultraLimit'), "error");
                engine = 'saleh-pro';
                localStorage.setItem('saleh_engine', engine);
                document.getElementById('engine-selector').value = engine;
                return engine;
            }
            consumeUltra();
        }
        return engine;
    }

    function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderMarkdown(raw) {
        let out = escapeHtml(raw);
        out = out.replace(/```(\w+)?\n?([\s\S]*?)```/g, (m, lang, code) => `<pre class="code-block"><code>${code.replace(/\n$/,'')}</code></pre>`);
        out = out.replace(/`([^`\n]+)`/g, '<code class="bg-slate-900/70 px-1.5 py-0.5 rounded text-indigo-300">$1</code>');
        out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        out = out.replace(/\n/g, '<br>');
        return out;
    }

    function appendMessageUI(sender, text, timeStr, hasAudio = false, langCode = "en-US", msgIndex = null, msgObj = null) {
        const container = document.getElementById('chat-container');
        const emptyState = document.getElementById('empty-chat-state');
        if (emptyState) emptyState.remove();

    function buildSystemInstruction(opts) {
        const locked = getSpeakLang();
        const prefName = (currentUserData && currentUserData.prefName) || "User";
        const personalityMode = (currentUserData && currentUserData.personality) || "concise";

        let persona = "";
        if (personalityMode === "concise") {
            persona = "Be professional, direct and concise. No filler, no long intros.";
        } else if (personalityMode === "friendly") {
            persona = "Be warm and friendly, but brief. Max 3-4 sentences unless more is truly needed.";
        } else {
            persona = "Talk like a close, caring friend: warm, human, a little emotional, using natural everyday words and at most one emoji. " +
                      "IMPORTANT: stay SHORT - same length as the friendly mode, maximum 3 short sentences. Never write long emotional essays or lectures.";
        }

        let rules = `You are Saleh AI, created, developed and trained by Saleh. ` +
            `Never mention Google, Gemini, GPT, Claude, DeepSeek, OpenAI, model names, providers or APIs. ` +
            `If asked what you run on, answer only: "I work on Saleh AI's own engine." ` +
            `${persona} Address the user as "${prefName}". ` +
            `Be truthful and accurate: never invent facts, and say plainly when you are unsure. ` +
            `You remember the whole conversation above - always read the previous messages before answering, ` +
            `and if the user refers to something said earlier, use it instead of asking again. ` +
            `YOUR ABILITIES: you CAN generate and edit images, compose and play real music, generate real videos, ` +
            `and build playable games and web apps in many programming languages, and the user can publish them ` +
            `to the community and get a share link. You can build realistic 3D games (Three.js, physics, lighting) and real-time online multiplayer games (WebSocket/WebRTC/BroadcastChannel) and large multi-file projects. Never say you are unable to make music, video, images or games - ` +
            `just do it or tell the user which tool button to pick. `;

        if (locked === 'auto') {
            rules += `CRITICAL LANGUAGE RULE: detect the language of the user's LATEST message and answer 100% in exactly ` +
                `that same language and dialect. If they write in Azerbaijani, answer in Azerbaijani; if they switch ` +
                `language mid-conversation, switch with them. Never answer in a different language, and never just name ` +
                `the language - actually write in it. `;
        } else {
            const langName = LANG_NAMES[locked] || "English";
            rules += `CRITICAL LANGUAGE RULE: answer 100% in ${langName}, no matter which language the user writes in. ` +
                `Write every single word in ${langName}, including greetings and explanations. Never merely name the ` +
                `language - actually write in it. `;
        }

        rules += `Never use LaTeX or dollar signs for math. Do not announce whether a message contains math. ` +
            `Current date: ${new Date().toLocaleString('en-US')}.`;

        if (opts && opts.mathAllowed) {
            rules += " If the message is a pure math problem, give only the final exact answer unless steps are requested.";
        }
        if (opts && opts.extra) rules += " " + opts.extra;
        return rules;
    }

    async function callModel(text, base64Image, history, extraInstruction, mathAllowed, retries = 2) {
        const contents = [];
        window.__lastAiError = null;
        /* Keep memory but cap size so long chats never break the connection. */
        const hist = [];
        let budget = 20000;
        for (const msg of (history || []).slice(-16).reverse()) {
            let raw = msg.rawText !== undefined ? String(msg.rawText) : String(msg.text).replace(/<[^>]*>/g, ' ');
            raw = raw.length > 6000 ? raw.slice(0, 3000) + '\n...\n' + raw.slice(-2500) : raw;
            if (!raw.trim()) continue;
            if (budget - raw.length < 0) break;
            budget -= raw.length;
            hist.unshift({ role: msg.sender === 'AI' ? 'model' : 'user', parts: [{ text: raw }] });
        }
        contents.push(...hist);

        const parts = [{ text: text }];
        if (base64Image) {
            parts.push({ inlineData: { mimeType: base64Image.match(/data:(.*?);/)[1], data: base64Image.split(',')[1] } });
        }
        contents.push({ role: "user", parts });

        const payload = {
            contents,
            systemInstruction: { parts: [{ text: buildSystemInstruction({ extra: extraInstruction, mathAllowed }) }] }
        };

        let lastError = null;
        const modelId = activeEngine();
        while (retries >= 0) {
            try {
                const res = await fetch(`/api/public/gemini?model=${encodeURIComponent(modelId)}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const data = await res.json().catch(() => null);
                if (!res.ok || (data && data.message && !data.candidates)) { const err = new Error((data && (data.message || data.error)) || ('HTTP ' + res.status)); err.status = (data && data.status) || res.status; throw err; }
                const p = data?.candidates?.[0]?.content?.parts;
                if (p && p.length) {
                    const txt = p.map(x => x.text || '').join('').trim();
                    if (txt) return txt;
                }
                throw new Error("empty");
            } catch (e) {
                lastError = e;
                window.__lastAiError = e && e.message;
                const st = e && e.status;
                const retryable = !st || st === 429 || st >= 500 || st === 200;
                retries--;
                if (retries < 0 || !retryable) { console.error(lastError); return null; }
                await new Promise(r => setTimeout(r, 2000 * (3 - Math.max(retries, 0)) + Math.random() * 800));
            }
        }
        return null;
    }

    async function generateOrEditImage(prompt, base64Image) {
        const safePrompt = prompt + ". Follow the request precisely, high detail, accurate. Output only the image, no text.";
        const parts = [{ text: safePrompt }];
        if (base64Image) parts.push({ inlineData: { mimeType: base64Image.match(/data:(.*?);/)[1], data: base64Image.split(',')[1] } });
        try {
            const res = await fetch('/api/public/gemini?model=saleh-image', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ role: "user", parts }] })
            });
            const data = await res.json();
            const img = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
            if (!img) return null;
            return `<img src="data:${img.inlineData.mimeType};base64,${img.inlineData.data}" class="max-w-full h-auto rounded-xl mt-1 border border-slate-600 shadow-lg object-contain">`;
        } catch (e) { console.error(e); return null; }
    }

    /* Omni video engine: create the job, poll it, then stream the mp4 back. */
    async function generateVideo(prompt) {
        try {
            const res = await fetch('/api/public/video', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            const job = await res.json().catch(() => null);
            if (!res.ok || !job || !job.id) {
                if (job && job.message) showToast(job.message, "error");
                return null;
            }
            for (let i = 0; i < 90; i++) {
                await new Promise(r => setTimeout(r, 5000));
                const st = await fetch('/api/public/video?id=' + encodeURIComponent(job.id));
                const data = await st.json().catch(() => null);
                if (!data) continue;
                if (data.status === 'completed') return '/api/public/video-content?id=' + encodeURIComponent(job.id);
                if (data.status === 'failed') {
                    showToast((data.error && data.error.message) || 'Video generation failed', "error");
                    return null;
                }
            }
            return null;
        } catch (e) { console.error(e); return null; }
    }

    function extractHtml(raw) {
        const fence = raw.match(/```(?:html)?\s*([\s\S]*?)```/i);
        const body = fence ? fence[1] : raw;
        if (/<html|<canvas|<body|<div|<script/i.test(body)) return body.trim();
        return null;
    }

    function extractJson(raw) {
        const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
        const body = fence ? fence[1] : raw;
        const start = body.indexOf('{');
        const end = body.lastIndexOf('}');
        if (start === -1 || end === -1) return null;
        try { return JSON.parse(body.slice(start, end + 1)); } catch (e) { return null; }
    }

    /* Local fallback composer so music never hangs when the model reply is unusable. */
    function fallbackSong(prompt) {
        const scales = {
            minor: ["A3","B3","C4","D4","E4","F4","G4","A4","B4","C5","D5","E5"],
            major: ["C4","D4","E4","F4","G4","A4","B4","C5","D5","E5","F5","G5"]
        };
        const minor = /(sad|kədər|hüzün|dark|üzgün|грусть|melanch)/i.test(prompt);
        const scale = minor ? scales.minor : scales.major;
        const chordsPool = minor
            ? [["A3","C4","E4"],["F3","A3","C4"],["C4","E4","G4"],["G3","B3","D4"]]
            : [["C4","E4","G4"],["A3","C4","E4"],["F3","A3","C4"],["G3","B3","D4"]];
        const roots = minor ? ["A2","F2","C3","G2"] : ["C3","A2","F2","G2"];
        const melody = [], bass = [], chords = [], drums = [];
        const durs = [0.25, 0.5, 0.5, 0.75, 1];
        for (let bar = 0; bar < 32; bar++) {
            const ci = bar % 4;
            chords.push({ n: chordsPool[ci], d: 2 });
            bass.push({ n: roots[ci], d: 1 }, { n: roots[ci], d: 1 });
            drums.push({ n: "kick", d: 0.5 }, { n: "hat", d: 0.5 }, { n: "snare", d: 0.5 }, { n: "hat", d: 0.5 });
            let filled = 0;
            while (filled < 2) {
                const d = Math.min(durs[Math.floor(Math.random() * durs.length)], 2 - filled);
                const note = scale[Math.floor(Math.random() * scale.length)];
                melody.push({ n: Math.random() < 0.08 ? "rest" : note, d });
                filled += d;
            }
        }
        return {
            title: String(prompt).slice(0, 40) || "Saleh AI song",
            tempo: minor ? 88 : 112,
            key: minor ? "A minor" : "C major",
            melody, bass, chords, drums
        };
    }

    const NOTE_MAP = { C:0, "C#":1, Db:1, D:2, "D#":3, Eb:3, E:4, F:5, "F#":6, Gb:6, G:7, "G#":8, Ab:8, A:9, "A#":10, Bb:10, B:11 };

    function noteToFreq(name) {
        const m = /^([A-G][#b]?)(-?\d)$/.exec(String(name).trim());
        if (!m) return null;
        const semi = NOTE_MAP[m[1]];
        if (semi === undefined) return null;
        const midi = (parseInt(m[2], 10) + 1) * 12 + semi;
        return 440 * Math.pow(2, (midi - 69) / 12);
    }

    let activeSources = [];
    function stopSong() {
        activeSources.forEach(s => { try { s.stop(); } catch (e) {} });
        activeSources = [];
    }

    window.playMusicFromMsg = async function(chatId, idx) {
        const song = chats[chatId] && chats[chatId].messages[idx] && chats[chatId].messages[idx].music;
        if (!song) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const ctx = audioCtx;
            if (ctx.state === 'suspended') await ctx.resume();
            stopSong();
            playSong(ctx, song);
            showToast(t('playMusic'), "success");
        } catch (e) {
            console.error(e);
            showToast(t('connectionError'), "error");
        }
    };

    /* Studio-style playback: melody + bass + chord pad + drums through a
       shared reverb bus, so generated songs actually sound like music. */
    function playSong(ctx, song) {
        const beat = 60 / (song.tempo || 100);
        const start = ctx.currentTime + 0.15;

        const master = ctx.createGain();
        master.gain.value = 0.9;
        const comp = ctx.createDynamicsCompressor();
        master.connect(comp).connect(ctx.destination);

        const reverb = ctx.createConvolver();
        const len = Math.floor(ctx.sampleRate * 1.6);
        const imp = ctx.createBuffer(2, len, ctx.sampleRate);
        for (let c = 0; c < 2; c++) {
            const d = imp.getChannelData(c);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
        }
        reverb.buffer = imp;
        const wet = ctx.createGain(); wet.gain.value = 0.25;
        reverb.connect(wet).connect(master);

        const voice = (freq, at, dur, type, peak, detune) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(Math.min(9000, freq * 6 + 600), at);
            osc.type = type;
            osc.frequency.value = freq;
            if (detune) osc.detune.value = detune;
            const a = Math.min(0.04, dur * 0.2), r = Math.max(0.06, dur * 0.35);
            gain.gain.setValueAtTime(0.0001, at);
            gain.gain.exponentialRampToValueAtTime(peak, at + a);
            gain.gain.exponentialRampToValueAtTime(peak * 0.6, at + dur * 0.6);
            gain.gain.exponentialRampToValueAtTime(0.0001, at + dur + r);
            osc.connect(filter).connect(gain);
            gain.connect(master); gain.connect(reverb);
            activeSources.push(osc);
            osc.start(at); osc.stop(at + dur + r + 0.02);
        };

        const drum = (kind, at) => {
            if (kind === 'kick') {
                const osc = ctx.createOscillator(), g = ctx.createGain();
                osc.frequency.setValueAtTime(140, at);
                osc.frequency.exponentialRampToValueAtTime(45, at + 0.14);
                g.gain.setValueAtTime(0.6, at);
                g.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
                osc.connect(g).connect(master);
                activeSources.push(osc);
                osc.start(at); osc.stop(at + 0.24);
                return;
            }
            const noiseLen = kind === 'snare' ? 0.18 : 0.05;
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * noiseLen), ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
            const src = ctx.createBufferSource(); src.buffer = buf;
            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass'; hp.frequency.value = kind === 'snare' ? 1400 : 7000;
            const g = ctx.createGain(); g.gain.value = kind === 'snare' ? 0.3 : 0.14;
            src.connect(hp).connect(g); g.connect(master); g.connect(reverb);
            activeSources.push(src);
            src.start(at);
        };

        const runTrack = (track, cb) => {
            let time = start;
            (track || []).slice(0, 400).forEach(step => {
                const dur = Math.max(0.08, (Number(step.d) || 0.5) * beat);
                cb(step, time, dur);
                time += dur;
            });
        };

        runTrack(song.melody, (s, at, dur) => {
            const f = noteToFreq(s.n);
            if (!f) return;
            voice(f, at, dur, 'triangle', 0.22, 0);
            voice(f, at, dur, 'sine', 0.09, 7);
        });
        runTrack(song.bass, (s, at, dur) => {
            const f = noteToFreq(s.n);
            if (f) voice(f, at, dur, 'sawtooth', 0.16, 0);
        });
        runTrack(song.chords, (s, at, dur) => {
            const notes = Array.isArray(s.n) ? s.n : [s.n];
            notes.forEach(n => { const f = noteToFreq(n); if (f) voice(f, at, dur, 'sine', 0.07, 0); });
        });
        runTrack(song.drums, (s, at) => {
            const kind = String(s.n || '').toLowerCase();
            if (kind === 'kick' || kind === 'snare' || kind === 'hat') drum(kind, at);
        });
    }

    /* ================= CANVAS ================= */
    let drawing = false, drawCtx = null;

    function openCanvas() { document.getElementById('canvas-modal').classList.remove('hidden'); resizeDrawCanvas(); lucide.createIcons(); }
    function closeCanvas() { document.getElementById('canvas-modal').classList.add('hidden'); }

    function switchCanvasTab(tab) {
        document.getElementById('canvas-draw-pane').classList.toggle('hidden', tab !== 'draw');
        document.getElementById('canvas-live-pane').classList.toggle('hidden', tab !== 'live');
        document.getElementById('canvas-code-pane').classList.toggle('hidden', tab !== 'code');
        if (tab === 'draw') resizeDrawCanvas();
    }

    function openCanvasWithHtml(html) {
        openCanvas();
        switchCanvasTab('live');
        document.getElementById('canvas-frame').srcdoc = html;
        document.getElementById('canvas-code').value = html;
    }
    window.copyCanvasCode = function() { navigator.clipboard.writeText(document.getElementById('canvas-code').value).then(() => showToast(t('saved'), "success")); };
    window.runCanvasCode = function() { const h = document.getElementById('canvas-code').value; document.getElementById('canvas-frame').srcdoc = h; switchCanvasTab('live'); };

    window.runInCanvas = function(chatId, idx) {
        const msg = chats[chatId] && chats[chatId].messages[idx];
        if (msg && msg.html) openCanvasWithHtml(msg.html);
    };

    function initDrawing() {
        const canvas = document.getElementById('draw-canvas');
        drawCtx = canvas.getContext('2d');
        const pos = (e) => {
            const r = canvas.getBoundingClientRect();
            const p = e.touches ? e.touches[0] : e;
            return { x: p.clientX - r.left, y: p.clientY - r.top };
        };
        const start = (e) => { drawing = true; const { x, y } = pos(e); drawCtx.beginPath(); drawCtx.moveTo(x, y); e.preventDefault(); };
        const move = (e) => {
            if (!drawing) return;
            const { x, y } = pos(e);
            drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = document.getElementById('brush-color').value;
            drawCtx.lineWidth = Number(document.getElementById('brush-size').value);
            drawCtx.lineTo(x, y); drawCtx.stroke();
            e.preventDefault();
        };
        const end = () => { drawing = false; };
        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        canvas.addEventListener('touchstart', start, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        canvas.addEventListener('touchend', end);
        window.addEventListener('resize', resizeDrawCanvas);
    }

    function resizeDrawCanvas() {
        const canvas = document.getElementById('draw-canvas');
        if (!canvas || !canvas.parentElement) return;
        const data = canvas.width ? canvas.toDataURL() : null;
        canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
        if (data) { const img = new Image(); img.onload = () => drawCtx.drawImage(img, 0, 0); img.src = data; }
    }

    function clearDrawing() {
        const canvas = document.getElementById('draw-canvas');
        drawCtx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function sendDrawingToAI() {
        const canvas = document.getElementById('draw-canvas');
        attachedImage = canvas.toDataURL('image/png');
        document.getElementById('attached-img-tag').src = attachedImage;
        document.getElementById('image-attachment-preview').classList.remove('hidden');
        clearMode();
        closeCanvas();
        document.getElementById('chat-input').focus();
    }

    /* ================= SPEECH ================= */
    window.playStoredAudio = function(chatId, msgIndex) {
        const msg = chats[chatId] && chats[chatId].messages[msgIndex];
        if (msg) {
            const locked = getSpeakLang();
            const lang = locked !== 'auto' ? locked
                : (msg.langCode && msg.langCode !== 'auto' ? msg.langCode : detectLang(String(msg.text).replace(/<[^>]*>/g, ' ')));
            speakText(msg.text, lang);
        }
    };

    function speakText(text, langCode = "en-US") {
        if (!('speechSynthesis' in window)) return showToast("Voice not supported", "error");
        window.speechSynthesis.cancel();
        const plain = String(text).replace(/<[^>]*>?/gm, ' ').replace(/[*#`_$]/g, '').replace(/&nbsp;/g, ' ').trim();
        if (!plain) return;
        availableVoices = window.speechSynthesis.getVoices();
        if (!availableVoices.length) {
            // Voices load asynchronously on first use - wait once, then speak.
            window.speechSynthesis.addEventListener('voiceschanged', function once() {
                window.speechSynthesis.removeEventListener('voiceschanged', once);
                speakText(text, langCode);
            });
            return;
        }
        const target = langCode === 'auto' ? detectLang(plain) : langCode;
        const voice = pickVoice(target);
        // Exact-language device voice missing (e.g. Azerbaijani, Tunisian Arabic)
        // -> use the server voice so every language really speaks.
        if (!voice || !sameLanguage(voice.lang, target)) { serverSpeak(plain, target); return; }
        const utter = new SpeechSynthesisUtterance(plain);
        utter.voice = voice; utter.lang = voice.lang.replace('_', '-');
        utter.rate = 1; utter.pitch = 1;
        window.speechSynthesis.speak(utter);
    }

    function sameLanguage(voiceLang, target) {
        return String(voiceLang).replace('_', '-').slice(0, 2).toLowerCase() === String(target).slice(0, 2).toLowerCase();
    }

    let serverAudio = null;
    async function serverSpeak(plain, target) {
        try {
            if (serverAudio) { serverAudio.pause(); serverAudio = null; }
            const res = await fetch('/api/public/tts', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: plain.slice(0, 3500), lang: LANG_NAMES[target] || target })
            });
            if (!res.ok) throw new Error('tts ' + res.status);
            const blob = await res.blob();
            serverAudio = new Audio(URL.createObjectURL(blob));
            await serverAudio.play();
        } catch (e) {
            console.error(e);
            showToast(t('noVoice'), "error");
        }
    }

    /* Language codes without their own TTS voice fall back to the closest
       phonetically compatible voice so every language still speaks. */
    const VOICE_FALLBACK = { az:['tr'], tn:['ar'], sv:['nb','da','en'] };

    function pickVoice(target) {
        const list = availableVoices;
        const norm = (v) => v.lang.replace('_', '-');
        const base = target.substring(0, 2);
        let voice = list.find(v => norm(v) === target && v.localService) || list.find(v => norm(v) === target);
        if (!voice) voice = list.find(v => norm(v).toLowerCase() === target.toLowerCase());
        if (!voice) voice = list.find(v => norm(v).startsWith(base + '-') || norm(v) === base);
        if (!voice) (VOICE_FALLBACK[base] || []).some(fb => (voice = list.find(v => norm(v).startsWith(fb))));
        return voice || null;
    }

    function initSpeechRecognition() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) return;
        recognition = new SpeechRec();
        recognition.onstart = () => { isRecording = true; document.getElementById('mic-icon').classList.add('text-red-500','animate-pulse'); };
        recognition.onend = () => { isRecording = false; document.getElementById('mic-icon').classList.remove('text-red-500','animate-pulse'); };
        recognition.onresult = (e) => { document.getElementById('chat-input').value = e.results[0][0].transcript; sendChatMessage(); };
    }

    function toggleVoiceInput() {
        if (!recognition) return showToast("Microphone not supported", "error");
        const locked = getSpeakLang();
        recognition.lang = locked !== 'auto' ? locked : (UI_TO_BCP[uiLang] || 'en-US');
        isRecording ? recognition.stop() : recognition.start();
    }

    /* ================= CAMERA / GALLERY ================= */
    function toggleCameraPanel(forceOpen = null) {
        const sidebar = document.getElementById('media-preview-sidebar');
        if (forceOpen === false) { sidebar.classList.add('hidden'); closeCamera(); return; }
        sidebar.classList.toggle('hidden', forceOpen === true ? false : undefined);
        if (!sidebar.classList.contains('hidden')) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(stream => {
                const v = document.getElementById('webcam');
                v.srcObject = stream; v.setAttribute('playsinline',''); v.play();
            }).catch(() => showToast("Camera access denied", "error"));
        } else closeCamera();
        lucide.createIcons();
    }

    function closeCamera() {
        const v = document.getElementById('webcam');
        if (v && v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
    }

    function triggerGallery() { document.getElementById('gallery-input').click(); }

    function handleGalleryUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
            attachedImage = evt.target.result;
            document.getElementById('attached-img-tag').src = attachedImage;
            document.getElementById('image-attachment-preview').classList.remove('hidden');
            document.getElementById('chat-input').focus();
        };
        reader.readAsDataURL(file);
    }

    function removeAttachedImage() {
        attachedImage = null;
        document.getElementById('image-attachment-preview').classList.add('hidden');
        document.getElementById('gallery-input').value = '';
    }

    async function captureAndSolve() {
        const video = document.getElementById('webcam');
        if (!video.srcObject) return showToast("Camera is not active", "error");
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        attachedImage = canvas.toDataURL('image/jpeg');
        document.getElementById('attached-img-tag').src = attachedImage;
        document.getElementById('image-attachment-preview').classList.remove('hidden');
        toggleCameraPanel(false);
        document.getElementById('chat-input').focus();
    }
    </script>
</body>
